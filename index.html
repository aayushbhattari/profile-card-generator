<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        background-color: #222;
      }

      input {
        display: block;
        margin-left: 50px;
        background-color: #555;
      }
      #main {
        padding: 50px;
      }

      .card {
        border: 1px solid white;
        border-radius: 5px;
        padding: 22px;
        display: inline-block;
        margin-top: 35px;
        margin-left: 42px;
        color: white;
        width: 255px;
        height: auto;
      }
      .profile {
        border: 2px solid black;
        height: 75px;
        width: 75px;
        border-radius: 50%;
        box-sizing: border-box;
        margin-bottom: 15px;
        overflow: hidden;
      }

      .profile img {
        height: 75px;
        width: 75px;
        object-fit: cover;
        display: block;
      }

        h2 {
        margin-top: 10px;
        margin-bottom: 15px;
      }

      h3 {
        margin-bottom: 15px;
    
      }

      #heading{
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="main">
        <h2 id="heading">PROFILE CARD GENERATOR</h2>
      <form action="">
        <input type="text" placeholder="Profile Pic" />
        <input type="text" placeholder="Name" />
        <input type="text" placeholder="Occupation" />
        <input type="text" placeholder="About" />
        <input type="submit" />
      </form>

     
    </div>
    <script src="script.js"></script>
  </body>
</html>
